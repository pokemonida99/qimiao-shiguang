<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>棲渺拾光 ‧ 燈下資料館</title>
<meta name="description" content="《黃泉燒肉店》六季一百零四集的分集大綱、故事線、人物誌、詞彙資料庫與關係圖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================ tokens ============================ */
:root{
  --ink:#06080E; --ink2:#0B0F1A; --ink3:#11162355;
  --paper:#EFE7DA; --muted:rgba(239,231,218,.58); --faint:rgba(239,231,218,.34);
  --amber:#E9A85C; --amber-hi:#F7DCAE; --amber-dim:rgba(233,168,92,.16);
  --sakura:#E9A2B4; --jade:#7FD6C1; --blood:#C05A5A;
  --line:rgba(233,168,92,.18); --line-soft:rgba(239,231,218,.10);
  --panel:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  --serif:"Noto Serif TC","Songti TC","PingFang TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --r:16px; --nav-h:60px; --head-h:56px;
  --wrap:1160px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-weight:300; line-height:1.85; letter-spacing:.02em;
  overflow-x:hidden; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--amber);text-decoration:none}
::selection{background:rgba(233,168,92,.3)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}

/* ============================ backdrop ============================ */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(70% 45% at 82% 6%, rgba(60,42,86,.55), transparent 70%),
    radial-gradient(60% 40% at 12% 88%, rgba(233,168,92,.13), transparent 72%),
    radial-gradient(90% 60% at 50% 40%, rgba(16,22,40,.9), transparent 80%),
    linear-gradient(180deg,#080B14 0%,#06080E 55%,#08060B 100%);}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.42'/></svg>");}
.petals{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-6vh;width:9px;height:9px;border-radius:60% 0 60% 0;
  background:linear-gradient(140deg,rgba(233,162,180,.55),rgba(233,168,92,.25));
  animation:fall linear infinite;opacity:0}
@keyframes fall{
  0%{transform:translate3d(0,-8vh,0) rotate(0deg);opacity:0}
  8%{opacity:.7} 92%{opacity:.5}
  100%{transform:translate3d(9vw,108vh,0) rotate(420deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.petal{display:none}*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============================ chrome ============================ */
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:18px}
header.top{position:sticky;top:0;z-index:60;height:var(--head-h);
  display:flex;align-items:center;gap:12px;
  background:rgba(6,8,14,.72);backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;gap:9px;font-family:var(--serif);font-weight:700;
  font-size:17px;letter-spacing:.16em;color:var(--amber-hi);white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:.24em;color:var(--faint)}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line-soft);color:var(--muted);transition:.2s}
.iconbtn:hover,.iconbtn:active{color:var(--amber-hi);border-color:var(--line);background:rgba(233,168,92,.07)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

nav.desk{display:none}
@media(min-width:820px){
  body{padding-bottom:0}
  nav.desk{display:flex;gap:2px;align-items:center}
  nav.desk button{font-size:13.5px;letter-spacing:.14em;padding:9px 15px;border-radius:10px;color:var(--muted);transition:.2s;font-family:var(--serif);font-weight:600}
  nav.desk button:hover{color:var(--paper);background:rgba(255,255,255,.05)}
  nav.desk button[aria-current="true"]{color:var(--amber-hi);background:var(--amber-dim)}
}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(6,8,14,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line-soft)}
@media(min-width:820px){nav.tab{display:none}}
nav.tab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;letter-spacing:.1em;color:var(--faint);font-family:var(--serif);font-weight:600;transition:.18s}
nav.tab button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.tab button[aria-current="true"]{color:var(--amber-hi)}
nav.tab button[aria-current="true"] svg{filter:drop-shadow(0 0 6px rgba(233,168,92,.55))}

/* ============================ common bits ============================ */
.page{display:none;animation:rise .5s cubic-bezier(.2,.7,.3,1)}
.page.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section{padding-block:44px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sec-head h2{font-family:var(--serif);font-weight:700;text-wrap:balance;font-size:clamp(21px,5vw,27px);letter-spacing:.1em;white-space:nowrap}
.sec-head .en{font-size:10px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;white-space:nowrap;padding-top:6px}
.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lede{color:var(--muted);font-size:15px;max-width:60ch}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line),transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--amber);
  background:rgba(233,168,92,.07);white-space:nowrap}
.chip.dim{color:var(--faint);border-color:var(--line-soft);background:rgba(255,255,255,.03)}
.chip.pink{color:var(--sakura);border-color:rgba(233,162,180,.28);background:rgba(233,162,180,.08)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.vert{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.28em}
.orn{display:block;width:100%;height:16px;margin-block:6px;
  background:radial-gradient(circle at 50% 50%,var(--line) 1.4px,transparent 1.6px) 50%/13px 13px repeat-x;opacity:.75}

/* seal / spoiler */
.seal{position:relative}
.seal[data-locked="1"] > *{filter:blur(7px) saturate(.4);opacity:.5;pointer-events:none;user-select:none}
.seal[data-locked="1"]::after{content:attr(data-seal);position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:12.5px;letter-spacing:.2em;color:var(--amber);
  background:rgba(6,8,14,.28);border:1px dashed var(--line);border-radius:10px;cursor:pointer}

/* ============================ hero ============================ */
.hero{position:relative;min-height:min(92svh,760px);display:flex;align-items:flex-end;overflow:hidden}
.hero-img{position:absolute;inset:0;background:#06080E}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:70% 42%;opacity:.82}
.hero-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,8,14,.86) 0%,rgba(6,8,14,.12) 28%,rgba(6,8,14,.62) 60%,#06080E 98%),
             linear-gradient(90deg,rgba(6,8,14,.86),rgba(6,8,14,.05) 62%)}
.hero-in{position:relative;padding-block:0 44px;width:100%}
.hero-kicker{display:flex;align-items:center;gap:10px;color:var(--amber);font-size:11px;letter-spacing:.34em;margin-bottom:16px}
.hero-kicker::before{content:"";width:26px;height:1px;background:var(--amber);opacity:.7}
.hero h1{font-family:var(--serif);font-weight:900;text-wrap:balance;line-height:1.12;letter-spacing:.06em;
  font-size:clamp(38px,12.5vw,84px);
  text-shadow:0 0 46px rgba(233,168,92,.24),0 2px 24px rgba(0,0,0,.7)}
.hero h1 span{color:var(--amber-hi)}
.hero .sub{margin-top:14px;font-family:var(--serif);font-size:clamp(14px,3.8vw,19px);letter-spacing:.24em;color:var(--paper);opacity:.9}
.hero .meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.hero-cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:11px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;
  font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.12em;transition:.22s}
.btn.primary{background:linear-gradient(135deg,#F0B96E,#D98C43);color:#20140A;
  box-shadow:0 10px 30px -12px rgba(233,168,92,.85)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(233,168,92,.95)}
.btn.ghost{border:1px solid var(--line);color:var(--paper)}
.btn.ghost:hover{background:rgba(233,168,92,.1);border-color:var(--amber)}
.scrollcue{display:flex;align-items:center;gap:9px;margin-top:26px;font-size:10.5px;letter-spacing:.28em;color:var(--faint)}
.scrollcue i{display:block;width:1px;height:26px;background:linear-gradient(180deg,var(--amber),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.25;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}
.hero-strip{position:absolute;right:16px;top:0;bottom:120px;display:none;align-items:center}
@media(min-width:720px){.hero-strip{display:flex}}
.hero-strip span{font-family:var(--serif);font-size:14px;letter-spacing:.42em;color:rgba(239,231,218,.5);
  writing-mode:vertical-rl;text-orientation:upright}

/* lantern rule */
.lantern-rule{display:flex;align-items:center;gap:14px;color:var(--amber);opacity:.8;margin:6px 0 22px}
.lantern-rule::before,.lantern-rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.lantern-rule i{display:block;width:9px;height:12px;border-radius:46% 46% 40% 40%;background:radial-gradient(circle at 50% 35%,#FFD9A0,#E9A85C);
  box-shadow:0 0 14px rgba(233,168,92,.7)}

/* ============================ world pillars ============================ */
.pillars{display:grid;gap:14px}
@media(min-width:700px){.pillars{grid-template-columns:1fr 1fr}}
.pillar{padding:22px 20px}
.pillar h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.08em;margin-bottom:9px;color:var(--amber-hi)}
.pillar p{font-size:14.5px;color:var(--muted)}
.pillar .no{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--faint);display:block;margin-bottom:12px}

/* ============================ season cards ============================ */
.seasons{display:grid;gap:16px}
@media(min-width:760px){.seasons{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1020px){.seasons{grid-template-columns:repeat(4,1fr)}}
.season{position:relative;display:block;text-align:left;min-height:260px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line-soft);transition:.28s}
.season:hover{border-color:var(--line);transform:translateY(-3px)}
.season img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:.5s}
.season:hover img{opacity:.66;transform:scale(1.05)}
.season .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,14,.25),rgba(6,8,14,.9))}
.season .in{position:relative;padding:20px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-height:260px}
.season .kanji{position:absolute;top:16px;right:18px;font-family:var(--serif);font-weight:900;font-size:40px;
  color:rgba(239,231,218,.16);letter-spacing:.1em;writing-mode:vertical-rl}
.season .no{font-size:10.5px;letter-spacing:.34em;color:var(--amber)}
.season h3{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.08em;margin:6px 0 8px}
.season p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ============================ story page ============================ */
.seg{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:22px}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 16px;border-radius:999px;border:1px solid var(--line-soft);
  font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.1em;color:var(--muted);white-space:nowrap;transition:.2s}
.seg button[aria-current="true"]{color:var(--amber-hi);border-color:var(--amber);background:var(--amber-dim)}

.sbanner{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:22px;min-height:230px;display:flex;align-items:flex-end}
.sbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.46}
.sbanner .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,14,.35),rgba(6,8,14,.94))}
.sbanner .in{position:relative;padding:22px 20px}
.sbanner .kanji{font-family:var(--serif);font-weight:900;font-size:clamp(40px,13vw,64px);letter-spacing:.14em;
  color:var(--amber-hi);text-shadow:0 0 40px rgba(233,168,92,.35);line-height:1}
.sbanner h2{font-family:var(--serif);font-size:20px;letter-spacing:.12em;margin-top:10px;text-wrap:balance}
.sbanner .ll{margin-top:12px;font-size:14.5px;color:var(--muted);max-width:60ch}
.sq{margin:18px 0;padding:16px 18px;border-left:2px solid var(--amber);background:rgba(233,168,92,.05);
  font-family:var(--serif);font-size:16px;letter-spacing:.06em;color:var(--amber-hi)}

.known{list-style:none;display:grid;gap:11px;max-width:64ch}
.known li{position:relative;padding-left:26px;font-size:14.5px;color:var(--paper)}
.known li::before{content:"";position:absolute;left:4px;top:12px;width:7px;height:9px;border-radius:46% 46% 40% 40%;
  background:radial-gradient(circle at 50% 35%,#FFD9A0,#E9A85C);box-shadow:0 0 9px rgba(233,168,92,.6)}
.tl{list-style:none;position:relative;margin-top:18px;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(180deg,transparent,var(--line),var(--line),transparent)}
.tl li{position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:-23px;top:16px;width:9px;height:12px;border-radius:46% 46% 40% 40%;
  background:radial-gradient(circle at 50% 35%,#FFD9A0,#E9A85C);box-shadow:0 0 12px rgba(233,168,92,.7)}
.tl .ep-c{padding:16px 16px}
.tl .ep-no{font-family:var(--serif);font-size:11px;letter-spacing:.24em;color:var(--amber)}
.tl .ep-t{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.06em;margin:5px 0 8px;text-wrap:balance}
.tl .ep-p{font-size:14px;color:var(--muted);max-width:60ch}
.tl .ep-f{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tl .ep-f a{font-size:11.5px;letter-spacing:.08em;color:var(--amber)}
.epbox{margin-top:24px;padding:24px 20px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;background:rgba(255,255,255,.02)}
.epbox .k{font-family:var(--serif);font-size:17px;letter-spacing:.14em;color:var(--amber-hi)}
.epbox p{margin-top:9px;font-size:13.5px;color:var(--muted);max-width:46ch;margin-inline:auto}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:16px auto 0;max-width:280px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#E9A85C,#F7DCAE);border-radius:99px}

/* ============================ characters ============================ */
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.cgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.cgrid{grid-template-columns:repeat(4,1fr)}}
.cc{position:relative;border-radius:14px;overflow:hidden;text-align:left;border:1px solid var(--line-soft);
  aspect-ratio:3/4.1;transition:.3s;background:#0B0F1A}
.cc:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 20px 44px -22px rgba(0,0,0,.9)}
.cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;opacity:.86;transition:.55s}
.cc:hover img{transform:scale(1.06);opacity:1}
.cc .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,14,.05) 30%,rgba(6,8,14,.92))}
.cc .acc{position:absolute;left:0;right:0;top:0;height:2px;background:var(--acc,var(--amber));opacity:.85}
.cc .in{position:absolute;left:0;right:0;bottom:0;padding:14px 13px}
.cc .role{font-size:10px;letter-spacing:.2em;color:var(--acc,var(--amber))}
.cc h3{font-family:var(--serif);font-weight:700;font-size:clamp(19px,5.2vw,23px);letter-spacing:.14em;margin:5px 0 4px;
  text-shadow:0 2px 14px rgba(0,0,0,.8)}
.cc .one{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
.cc.noart{background:linear-gradient(160deg,#141A28,#080B13)}
.cc .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:900;
  font-size:64px;letter-spacing:.1em;color:rgba(239,231,218,.07);writing-mode:vertical-rl;text-orientation:upright}
.cc .ghost::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 38%,var(--acc,#E9A85C),transparent 72%);opacity:.11}
.cc .pend{position:absolute;top:10px;right:10px;font-size:9.5px;letter-spacing:.16em;padding:3px 8px;border-radius:99px;
  border:1px dashed var(--line);color:var(--faint);background:rgba(6,8,14,.6)}

/* character sheet */
.sheet{position:fixed;inset:0;z-index:90;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;
  display:none;animation:sheetin .38s cubic-bezier(.2,.75,.3,1)}
.sheet.on{display:block}
@keyframes sheetin{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sheet-close{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:95;
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(6,8,14,.78);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--paper)}
.sheet-close svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round}
.ch-hero.noart{background:linear-gradient(160deg,#141A28,#080B13)}
.ch-hero .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:900;
  font-size:clamp(90px,26vw,180px);color:rgba(239,231,218,.06);writing-mode:vertical-rl;text-orientation:upright}
.ch-hero{position:relative;aspect-ratio:4/4.4;max-height:66svh;overflow:hidden}
@media(min-width:820px){.ch-hero{aspect-ratio:16/8;max-height:none}}
.ch-hero img{width:100%;height:100%;object-fit:cover;object-position:50% 26%}
.ch-hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,14,.55) 0%,transparent 26%,rgba(6,8,14,.35) 62%,var(--ink) 99%)}
.ch-name{position:absolute;right:20px;bottom:26px;text-align:right}
.ch-name .vn{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,52px);letter-spacing:.16em;
  writing-mode:vertical-rl;text-orientation:upright;text-shadow:0 3px 26px rgba(0,0,0,.85);
  border-right:2px solid var(--acc,var(--amber));padding-right:14px;margin-left:auto}
.ch-role{position:absolute;left:20px;bottom:30px}
.ch-role .r{font-size:11px;letter-spacing:.26em;color:var(--acc,var(--amber))}
.ch-role .rd{font-size:10px;letter-spacing:.24em;color:var(--faint);margin-top:6px}
.ch-body{padding-block:24px 90px}
.ch-one{font-family:var(--serif);font-size:clamp(18px,5vw,25px);font-weight:600;line-height:1.7;letter-spacing:.06em;

.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);

.fields .v{font-family:var(--serif);font-size:14.5px;letter-spacing:.06em}
.blk{margin-bottom:28px}
.blk h4{font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--amber);margin-bottom:12px;

.blk .origin li,.blk .qline{max-width:64ch}
.ch-one{max-width:30ch}
.origin{display:grid;gap:12px}
.origin li{list-style:none;position:relative;padding:14px 16px 14px 42px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);font-size:14px;color:var(--muted)}
.origin li::before{content:counter(o);counter-increment:o;position:absolute;left:15px;top:13px;
  font-family:var(--serif);font-size:12px;color:var(--amber);opacity:.8}

.byline{margin-top:10px;font-size:11.5px;letter-spacing:.16em;color:var(--faint);text-align:right}
.qline{font-family:var(--serif);font-size:17px;line-height:2;letter-spacing:.06em;color:var(--amber-hi);

.gal{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.gal::-webkit-scrollbar{display:none}
.gal img{width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line-soft);flex:none;cursor:zoom-in}
.chnav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}

/* ============================ graph ============================ */
.graphwrap{position:relative;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;
  background:radial-gradient(60% 60% at 50% 45%,rgba(233,168,92,.07),transparent 70%),#080B13}
#graph{display:block;width:100%;height:clamp(470px,68svh,660px);touch-action:none;cursor:grab}
#graph.drag{cursor:grabbing}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:12px 14px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;border-radius:2px;display:block}
.gnode text{font-family:var(--serif);font-weight:700;letter-spacing:.1em;fill:#EFE7DA;paint-order:stroke;
  stroke:#06080E;stroke-width:4px;stroke-linejoin:round}
.gnode{cursor:pointer}
.gnode.dim{opacity:.22}
.gedge.dim{opacity:.07}
.gtip{position:absolute;left:12px;right:12px;bottom:12px;padding:14px 16px;border-radius:12px;
  background:rgba(8,11,19,.94);border:1px solid var(--line);backdrop-filter:blur(10px);display:none}
.gtip.on{display:block}
.gtip h4{font-family:var(--serif);font-size:17px;letter-spacing:.14em;margin-bottom:4px}
.gtip p{font-size:12.5px;color:var(--muted)}
.gtip .go{margin-top:10px}

/* ============================ glossary ============================ */
.searchbar{position:sticky;top:calc(var(--head-h) - 1px);z-index:40;padding-block:14px 12px;background:var(--ink);box-shadow:0 14px 18px -14px var(--ink)}
.sfield{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:12px;
  border:1px solid var(--line-soft);background:rgba(255,255,255,.04)}
.sfield input{flex:1;background:none;border:0;color:var(--paper);font-family:var(--sans);font-size:15px;outline:none}
.sfield input::placeholder{color:var(--faint)}
.sfield svg{width:17px;height:17px;stroke:var(--faint);fill:none;stroke-width:1.7}
.tgrid{display:grid;gap:12px}
@media(min-width:760px){.tgrid{grid-template-columns:1fr 1fr}}
.term{padding:18px 18px;text-align:left;scroll-margin-top:calc(var(--head-h) + 80px);transition:.25s}
.term.hit{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim),0 0 34px -12px rgba(233,168,92,.8)}
.term .tw{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.1em;color:var(--amber-hi)}
.term .tr{font-size:10.5px;letter-spacing:.2em;color:var(--faint);margin-top:3px}
.term .td{margin-top:10px;font-size:14px;color:var(--muted)}
.term .tl{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.term .tl button{font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line-soft);color:var(--faint)}

.count{font-size:12px;letter-spacing:.16em;color:var(--faint);margin-bottom:14px}

/* ============================ notes / quotes / works ============================ */
.notes{display:grid;gap:14px}
@media(min-width:900px){.notes{grid-template-columns:1fr 1fr}}
.note{display:flex;gap:0;overflow:hidden}
.note .txt{padding:20px 18px;flex:1;min-width:0}
.note .th{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--amber-hi);margin-bottom:9px}
.note p{font-size:13.5px;color:var(--muted)}
.note img{width:112px;object-fit:cover;flex:none;opacity:.8;cursor:zoom-in}
.note .sb{font-size:10px;letter-spacing:.2em;color:var(--faint);margin-bottom:8px}
.qgrid{display:grid;gap:14px}
@media(min-width:700px){.qgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.qgrid{grid-template-columns:repeat(3,1fr)}}
.qc{padding:24px 20px;display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:170px}

.qc .qf{font-size:11px;letter-spacing:.2em;color:var(--amber);opacity:.85}
.qc.hasimg{padding:0;min-height:0}

.works{display:grid;gap:14px}
@media(min-width:760px){.works{grid-template-columns:1fr 1fr}}
.work{display:flex;gap:14px;padding:16px;align-items:center}
.work img{width:78px;height:96px;object-fit:cover;border-radius:10px;flex:none}

  font-family:var(--serif);font-size:11px;letter-spacing:.14em;color:var(--faint)}
.work h4{font-family:var(--serif);font-size:17px;letter-spacing:.1em;margin-bottom:6px}
.work p{font-size:13px;color:var(--muted)}
.chan{padding:20px 18px}
.chan h4{font-family:var(--serif);font-size:18px;letter-spacing:.12em;margin-bottom:3px}
.chan .h{font-size:11.5px;letter-spacing:.14em;color:var(--amber);margin-bottom:12px}
.chan ul{list-style:none;display:grid;gap:9px;margin-top:12px}
.chan li{font-size:13px;color:var(--muted);padding-left:16px;position:relative}
.chan li::before{content:"—";position:absolute;left:0;color:var(--line);color:var(--amber);opacity:.6}

/* ============================ overlays ============================ */
.ov-panel{position:fixed;inset:0;z-index:100;background:rgba(4,6,11,.9);backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:center;padding:0}
.ov-panel.on{display:flex}
.ov-in{width:100%;max-width:640px;margin-top:calc(var(--head-h) + 10px);background:#0A0E17;

.ov-bd{overflow-y:auto;padding:10px 8px 18px}
.res{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:11px;transition:.16s}

.res .rt{font-family:var(--serif);font-size:15.5px;letter-spacing:.06em}
.res .rk{font-size:10.5px;letter-spacing:.18em;color:var(--amber);margin-bottom:3px}
.res .rd{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:34px 18px;text-align:center;color:var(--faint);font-size:13px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line-soft)}

.setrow .sd{font-size:11.5px;color:var(--faint);margin-top:3px;max-width:34ch}
.pill{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

.pill button[aria-pressed="true"]{color:var(--amber-hi);border-color:var(--amber);background:var(--amber-dim)}
.lb{position:fixed;inset:0;z-index:110;background:rgba(4,6,11,.95);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:92svh;border-radius:10px;object-fit:contain}

footer{padding:40px 0 60px;border-top:1px solid var(--line-soft);margin-top:30px}
footer p{font-size:12px;color:var(--faint);line-height:2}

/* ============================ v2 additions ============================ */
nav.tab{grid-template-columns:repeat(6,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-top:26px;max-width:560px}

.stats b{display:block;font-family:var(--serif);font-size:clamp(20px,5.6vw,26px);color:var(--amber-hi);letter-spacing:.04em;line-height:1.2}

/* season cards: 7 + extra */

/* episode grid */
.egrid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}

.epc{display:flex;flex-direction:column;text-align:left;border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);

.epc:hover .th img{transform:scale(1.05)}
.epc .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(6,8,14,.85))}
.epc .badge{position:absolute;left:9px;top:9px;z-index:1;font-family:var(--serif);font-size:11px;letter-spacing:.12em;
  padding:3px 8px;border-radius:99px;background:rgba(6,8,14,.72);border:1px solid var(--line);color:var(--amber-hi)}
.epc .gno{position:absolute;right:9px;bottom:8px;z-index:1;font-size:10px;letter-spacing:.14em;color:rgba(239,231,218,.7)}
.epc .bd{padding:11px 12px 13px}
.epc .t{font-family:var(--serif);font-weight:700;font-size:14.5px;letter-spacing:.04em;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.epc .p{margin-top:5px;font-size:11.5px;line-height:1.65;color:var(--faint);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.epc.lk .th img{filter:blur(10px) saturate(.4)}
.epc.lk .p{filter:blur(4px)}
.subhd{font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--amber);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.subhd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-soft),transparent)}

/* episode sheet */
.ep-hero{position:relative;overflow:hidden;min-height:min(70svh,520px);display:flex;align-items:flex-end}

  box-shadow:0 26px 60px -24px #000;flex:none}
.ep-hero .k{font-size:11px;letter-spacing:.26em;color:var(--amber)}

.ep-body{padding-block:22px 90px}

  font-family:var(--serif);font-size:15.5px;letter-spacing:.04em;color:var(--amber-hi);line-height:1.85}

.cast{display:flex;flex-wrap:wrap;gap:12px}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;text-align:center}

  display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:var(--faint)}
.av .ph img{width:100%;height:100%;object-fit:cover}
.av span{font-size:11.5px;letter-spacing:.04em;color:var(--muted);line-height:1.35}

.notesl{list-style:none;display:grid;gap:9px;max-width:66ch}
.notesl li{font-size:13.5px;color:var(--muted);padding-left:16px;position:relative}
.notesl li::before{content:"・";position:absolute;left:0;color:var(--amber)}

/* arcs */
.arcs{display:grid;gap:14px}
@media(min-width:760px){.arcs{grid-template-columns:1fr 1fr}}

.arc .faces img{width:84px;height:84px;object-fit:cover;flex:1;min-height:0}
.arc .tx{padding:16px 16px;min-width:0}
.arc .kj{font-family:var(--serif);font-size:11px;letter-spacing:.26em;color:var(--acc,var(--amber))}
.arc h3{font-family:var(--serif);font-size:20px;letter-spacing:.1em;margin:4px 0 8px}
.arc p{font-size:13px;color:var(--muted)}
.arc .n{margin-top:10px;font-size:11px;letter-spacing:.14em;color:var(--faint)}
.tl2{list-style:none;position:relative;padding-left:0;margin-top:10px;max-width:760px}

.tl2 .et{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.04em;margin:2px 0 4px}
.tl2 p{font-size:14px;color:var(--paper);opacity:.88;line-height:1.85}
.tl2 button{text-align:left;width:100%}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:16px}

/* characters v2 */
.cfilter{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.cgrid2{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(min-width:620px){.cgrid2{grid-template-columns:repeat(4,1fr)}}

.cc2 .ph{width:76%;aspect-ratio:1;margin:0 auto 9px;border-radius:50%;overflow:hidden;border:2px solid var(--acc,var(--line-soft));background:#141A28;
  display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--faint)}

.cc2 .r{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc2.lk .ph img{filter:blur(8px) grayscale(.6)}
.cc2.lk h3,.cc2.lk .r{filter:blur(4px)}
.featured{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:8px}
@media(min-width:700px){.featured{grid-template-columns:repeat(4,1fr)}}
.fc{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);text-align:left;transition:.25s}
.fc:hover{border-color:var(--line);transform:translateY(-3px)}
.fc img{width:100%;height:100%;object-fit:cover}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,8,14,.92))}
.fc .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12px}
.fc h3{font-family:var(--serif);font-size:19px;letter-spacing:.12em}

.ch2-hero .fac{font-size:10.5px;letter-spacing:.24em;color:var(--acc,var(--amber));margin-bottom:6px}
.apps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.apps button.lk img{filter:blur(6px)}
.srcnote{font-size:11.5px;color:var(--faint);margin-top:6px;letter-spacing:.04em}

.sfield.small{padding:9px 13px}

/* ============================ motion & 大寶篇 ============================ */
/* scroll reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1);transition-delay:var(--rd,0s)}
.rv.in{opacity:1;transform:none}
/* floating lanterns */
.lanterns{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.lan{position:absolute;bottom:-60px;width:14px;height:19px;border-radius:46% 46% 40% 40%;
  background:radial-gradient(circle at 50% 38%,#FFE2B0,#E9A85C 55%,#B4682A);
  box-shadow:0 0 18px 6px rgba(233,168,92,.35),0 0 46px 14px rgba(233,168,92,.12);
  animation:rise linear infinite;opacity:0}
.lan::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:7px;background:rgba(233,168,92,.5)}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(var(--s,1));opacity:0}10%{opacity:.8}
  50%{transform:translate3d(var(--dx,20px),-55vh,0) scale(var(--s,1))}90%{opacity:.55}
  100%{transform:translate3d(calc(var(--dx,20px)*-.6),-112vh,0) scale(var(--s,1));opacity:0}}
/* card tilt */
.tilt{transform-style:preserve-3d;will-change:transform}
/* gold shimmer */
.shimmer{background:linear-gradient(100deg,#F7DCAE 0%,#E9A85C 30%,#FFF3D6 45%,#E9A85C 60%,#F7DCAE 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}

/* 大寶篇 hero */
.dbhero{min-height:min(96svh,820px)}
.slides{position:absolute;inset:0;background:#05070C;overflow:hidden}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;
  transition:opacity 1.6s ease;transform:scale(1.08)}
.slides img.on{opacity:.78;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.16) translate3d(1.5%,1%,0)}to{transform:scale(1.02) translate3d(-1%,-1%,0)}}
.dbhero .hero-img::after{display:none}
.slides::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,8,14,.75) 0%,rgba(6,8,14,.05) 30%,rgba(6,8,14,.55) 62%,#06080E 99%),
             linear-gradient(90deg,rgba(6,8,14,.85),rgba(6,8,14,0) 70%)}
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#FFB86B;
  box-shadow:0 0 8px 2px rgba(255,150,70,.7);animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:1}100%{transform:translate3d(var(--dx,30px),-80vh,0);opacity:0}}
.dbhero h1{font-size:clamp(54px,17vw,120px);letter-spacing:.12em}
.dbhero .kicker2{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.26em;color:#FFD9A0;
  padding:6px 12px;border:1px solid rgba(233,168,92,.4);border-radius:99px;background:rgba(6,8,14,.5);margin-bottom:16px}
.dbhero .kicker2 i{width:7px;height:7px;border-radius:50%;background:#FF6B4A;box-shadow:0 0 10px #FF6B4A;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.dbhero .lead{margin-top:16px;max-width:30em;font-size:clamp(14px,3.8vw,16px);color:rgba(239,231,218,.86);line-height:1.95}
.dots{display:flex;gap:7px;margin-top:22px}
.dots button{width:22px;height:3px;border-radius:2px;background:rgba(239,231,218,.25);transition:.3s}
.dots button.on{width:40px;background:var(--amber)}
.hero-in .wrap{position:relative;z-index:2}

/* typed quote */
.typeq{font-family:var(--serif);font-weight:700;font-size:clamp(24px,7vw,44px);letter-spacing:.12em;line-height:1.5;color:var(--paper);text-align:center;margin:10px auto 6px;max-width:16em}
.typeq span{opacity:0;display:inline-block;transform:translateY(8px);filter:blur(6px);transition:opacity .5s,transform .5s,filter .5s}
.typeq.in span{opacity:1;transform:none;filter:none;transition-delay:calc(var(--i)*70ms)}
.typeq-src{text-align:center;font-size:11.5px;letter-spacing:.24em;color:var(--amber);margin-bottom:26px}

/* horizontal arc rail */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 30px),transparent)}
.rail::-webkit-scrollbar{height:4px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.rstep{flex:none;width:min(66vw,230px);scroll-snap-align:start;text-align:left;position:relative;border-radius:14px;overflow:hidden;
  border:1px solid var(--line-soft);background:#0A0E17;transition:.3s}
.rstep:hover{border-color:var(--amber);transform:translateY(-4px)}
.rstep img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;transition:.6s}
.rstep:hover img{transform:scale(1.06)}
.rstep .n{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:14px;color:#20140A;background:linear-gradient(135deg,#F7DCAE,#E9A85C);box-shadow:0 0 16px rgba(233,168,92,.6)}
.rstep .b{padding:12px 13px 14px}
.rstep .e{font-size:10.5px;letter-spacing:.16em;color:var(--amber)}
.rstep p{font-size:13px;line-height:1.75;color:var(--paper);opacity:.9;margin-top:4px}
.rstep.lk img{filter:blur(9px)} .rstep.lk p{filter:blur(5px)}
.railhint{font-size:11px;letter-spacing:.2em;color:var(--faint);text-align:right;margin-top:-6px}

/* family orbit */
.orbitwrap{display:grid;gap:22px;align-items:center;margin-top:30px}
@media(min-width:820px){.orbitwrap{grid-template-columns:1fr 1fr}}
.orbit{position:relative;width:min(84vw,380px);aspect-ratio:1;margin:0 auto}
.orbit .ring{position:absolute;inset:12%;border-radius:50%;border:1px dashed rgba(233,168,92,.35);animation:spin 60s linear infinite}
.orbit .ring2{position:absolute;inset:2%;border-radius:50%;border:1px solid rgba(233,168,92,.12)}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .core{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;
  border:3px solid #E9A85C;box-shadow:0 0 0 0 rgba(233,168,92,.6);animation:pulse 2.8s ease-out infinite}
.orbit .core img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,168,92,.55)}80%{box-shadow:0 0 0 26px rgba(233,168,92,0)}100%{box-shadow:0 0 0 0 rgba(233,168,92,0)}}
.orbit .sat{position:absolute;width:23%;transform:translate(-50%,-50%);text-align:center;animation:bob 5s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 7px))}}
.orbit .sat .ph{display:block;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--acc,#E9A85C);background:#141A28;transition:.3s}
.orbit .sat:hover .ph{transform:scale(1.08);box-shadow:0 0 22px var(--acc,#E9A85C)}
.orbit .sat .ph img{width:100%;height:100%;object-fit:cover}
.orbit .sat span{display:block;font-family:var(--serif);font-size:13px;letter-spacing:.1em;margin-top:5px}
.orbit .sat em{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.orbit .sat.lk .ph img{filter:blur(8px)}
.curse{position:relative;overflow:hidden;padding:24px 22px;border-radius:var(--r);border:1px solid rgba(192,90,90,.35);
  background:radial-gradient(80% 60% at 50% 110%,rgba(192,90,90,.28),transparent 70%),linear-gradient(180deg,rgba(20,10,14,.9),rgba(10,8,14,.9))}
.curse h3{font-family:var(--serif);font-size:24px;letter-spacing:.24em;color:#FFB9A8;text-shadow:0 0 18px rgba(255,107,74,.5)}
.curse .k{font-size:10.5px;letter-spacing:.3em;color:rgba(255,185,168,.6);margin-bottom:8px}
.curse p{font-size:14px;color:var(--paper);opacity:.88;margin-top:12px;line-height:1.95}
.curse .embers .ember{background:#FF8A5C}
.foreshadow{list-style:none;display:grid;gap:10px;margin-top:16px}
.foreshadow li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;color:var(--muted)}
.foreshadow b{font-family:var(--serif);font-weight:600;color:#FFD9A0;font-size:12px;letter-spacing:.1em;white-space:nowrap}

/* stat count */
.stats b{font-variant-numeric:tabular-nums}
/* featured arc badge */
.arc.main{border-color:rgba(233,168,92,.45);box-shadow:0 0 0 1px rgba(233,168,92,.15),0 20px 50px -30px rgba(233,168,92,.6)}
.arc .badge2{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.18em;padding:3px 9px;border-radius:99px;color:#20140A;background:linear-gradient(135deg,#F7DCAE,#E9A85C)}
/* timeline draw */
.tl2{position:relative}
.tl2 li{opacity:.25;transform:translateX(-8px);transition:opacity .7s,transform .7s}
.tl2 li.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv,.tl2 li{opacity:1!important;transform:none!important}.lan,.ember{display:none}.typeq span{opacity:1;transform:none;filter:none}}

.ep-hero .in{padding-block:56px 22px}
.ep-hero .poster{width:min(32vw,180px)}

.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

.elist{display:grid;gap:10px}
@media(min-width:820px){.elist{grid-template-columns:1fr 1fr}}
.erow{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;padding:10px;border-radius:12px;
  border:1px solid var(--line-soft);background:rgba(10,14,23,.6);transition:.25s}
.erow:hover{border-color:var(--line);background:rgba(233,168,92,.05)}
.erow .th{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#111622}

.gal.lk img{filter:blur(10px) saturate(.4)}

<script>
(function(){
"use strict";
var S = window.SITE, E = window.EPI;
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc = function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

/* ---------------------------------------------------------- data index */
var EP = {}, CH = {}, FAC = {}, MAXLV = 7;
E.episodes.forEach(function(e,i){ e.i=i; EP[e.id]=e; });
E.characters.forEach(function(c){ CH[c.name]=c; });
S.factions.forEach(function(f){ f.members.forEach(function(n){ FAC[n]=f; }); });
var GUESTS = {id:"guest", name:"客人與過客"};
function facOf(n){ return FAC[n] || GUESTS; }
function prof(n){ return S.profiles[n] || {}; }
function acc(n){ return prof(n).accent || "#E9A85C"; }
function epsOf(group){ return E.episodes.filter(function(e){return e.group===group}); }
function seasonById(id){ for(var i=0;i<S.seasons.length;i++) if(S.seasons[i].id===id) return S.seasons[i]; return null; }
function arcById(id){ for(var i=0;i<S.arcs.length;i++) if(S.arcs[i].id===id) return S.arcs[i]; return null; }
function termById(id){ for(var i=0;i<S.glossary.length;i++) if(S.glossary[i].id===id) return S.glossary[i]; return null; }
function epLabel(e){
  if(e.arc==="月老外傳") return "月老外傳 "+e.local;
  if(e.arc) return e.arc+" "+e.local;
  return (e.special? "第"+e.season+"季番外 "+e.local : "第"+e.season+"季 第"+e.local+"集");
}
function epShort(e){ return e.no ? "EP"+e.no : (e.special? "番外" : e.arc||""); }

function img(src, cls, alt){
  if(!src) return '<div class="'+(cls||"")+'" style="background:linear-gradient(150deg,#151A28,#0A0E17)"></div>';
  return '<img class="'+(cls||"")+'" src="'+src+'" alt="'+esc(alt||"")+'" loading="lazy">';
}
function secHead(h,en){ return '<div class="sec-head"><h2>'+h+'</h2><span class="en">'+en+'</span></div>'; }
function lantern(){ return '<div class="lantern-rule"><i></i></div>'; }
function avatar(n, size){
  var c = CH[n]; var lk = c && locked(c.lv);
  var inner = (c && c.img && !lk) ? '<img src="'+c.img+'" alt="" loading="lazy">' : esc(n.charAt(0));
  return '<button class="av" data-char="'+esc(n)+'" style="--acc:'+acc(n)+'"><span class="ph">'+inner+'</span><span>'+esc(lk?"？？？":n)+'</span></button>';
}
function firstSentence(t, n){
  var s = String(t||""); var m = (s.match(/^[^。！？]*[。！？]?/)||[s])[0];
  return (m.length > (n||60) ? m.slice(0,n||60)+"…" : m);
}

/* 長段大綱切成好讀的小段：約 70 字一段，只在句號處斷 */
function paras(t){
  var ss = String(t||"").match(/[^。！？]+[。！？]+」?|[^。！？]+$/g) || [];
  var out = [], cur = "";
  ss.forEach(function(x){ cur += x; if(cur.length >= 70){ out.push(cur); cur = ""; } });
  if(cur){ if(out.length && cur.length < 24) out[out.length-1] += cur; else out.push(cur); }
  return out;
}

var GC = {love:"#E9A2B4", bond:"#7FD6C1", rival:"#C05A5A", divine:"#E9A85C", duty:"#8FA6C4"};
var GLABEL = {love:"情感", bond:"羈絆", rival:"敵對", divine:"神緣", duty:"職務"};
function graphMarkup(){
  return '<div class="graphwrap"><svg id="graph" role="img" aria-label="人物關係圖"></svg>'+
    '<div class="gtip" id="gtip"></div>'+
    '<div class="legend">'+Object.keys(GC).map(function(k){
      return '<span><i style="background:'+GC[k]+'"></i>'+GLABEL[k]+'</span>';
    }).join("")+'</div>'+
  '</div>'+
  '<p class="lede" style="margin-top:14px;font-size:13px">拖曳可平移，滾輪或雙指縮放。點角色看關係，再點空白處復原。防雷模式下，超過進度的人物和關係不會出現。</p>';
}
var G = {nodes:[], edges:[], k:1, tx:0, ty:0, focus:null};
function buildGraph(){
  var svg = $("#graph"); if(!svg) return;
  var box = svg.getBoundingClientRect();
  var W = Math.round(box.width) || 700, H = Math.round(box.height) || 500;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  var rels = S.relations.filter(function(r){ return !locked(r.lv) && CH[r.a] && CH[r.b]; });
  var names = []; rels.forEach(function(r){ [r.a,r.b].forEach(function(n){ if(names.indexOf(n)<0) names.push(n); }); });
  var nodes = names.map(function(n){return {id:n, c:CH[n], x:0, y:0}});
  var index = {}; nodes.forEach(function(n,i){index[n.id]=i});
  var edges = rels.map(function(r){return {s:index[r.a], t:index[r.b], r:r}});
  var L = 100;
  nodes.forEach(function(n,i){ var a=i/nodes.length*Math.PI*2; n.x=Math.cos(a)*L*3; n.y=Math.sin(a)*L*3; });
  for(var it=0; it<700; it++){
    var fx=nodes.map(function(){return 0}), fy=nodes.map(function(){return 0});
    for(var i=0;i<nodes.length;i++) for(var j=i+1;j<nodes.length;j++){
      var A=nodes[i], B=nodes[j], dx=B.x-A.x, dy=B.y-A.y, d=Math.max(8,Math.hypot(dx,dy));
      var f=(L*L*2.6)/(d*d); fx[i]-=dx/d*f; fy[i]-=dy/d*f; fx[j]+=dx/d*f; fy[j]+=dy/d*f;
    }
    edges.forEach(function(e){
      var A=nodes[e.s], B=nodes[e.t], dx=B.x-A.x, dy=B.y-A.y, d=Math.max(1,Math.hypot(dx,dy));
      var f=(d-L*1.3)*0.06; fx[e.s]+=dx/d*f; fy[e.s]+=dy/d*f; fx[e.t]-=dx/d*f; fy[e.t]-=dy/d*f;
    });
    nodes.forEach(function(n,k){ n.x+=fx[k]*0.6 - n.x*0.004; n.y+=fy[k]*0.6 - n.y*0.004; });
  }
  var xs=nodes.map(function(n){return n.x}), ys=nodes.map(function(n){return n.y});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var pad=46, sc=Math.min((W-pad*2)/Math.max(1,x1-x0),(H-pad*2)/Math.max(1,y1-y0));
  nodes.forEach(function(n){ n.x=pad+(n.x-x0)*sc+((W-pad*2)-(x1-x0)*sc)/2; n.y=pad+(n.y-y0)*sc+((H-pad*2)-(y1-y0)*sc)/2; });
  G.nodes=nodes; G.edges=edges; G.W=W; G.H=H;
  G.r = Math.max(13, Math.min(24, L*sc*0.32)); G.fs = Math.max(9.5, Math.min(12.5, G.r*0.6));
  G.k=1; G.tx=0; G.ty=0; G.focus=null; paintGraph();
}
function paintGraph(){
  var svg = $("#graph"); if(!svg) return;
  var r = G.r, f = G.focus, conn = {};
  if(f!=null){ G.edges.forEach(function(e){ if(e.s===f||e.t===f){conn[e.s]=1;conn[e.t]=1;} }); }
  var defs = '<defs>'+G.nodes.map(function(n,i){
    return '<clipPath id="cp-'+i+'"><circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+r+'"/></clipPath>';
  }).join("")+'</defs>';
  var eh = G.edges.map(function(e){
    var a=G.nodes[e.s], b=G.nodes[e.t], mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
    var cx=mx-dy*0.1, cy=my+dx*0.1, dim=(f!=null && e.s!==f && e.t!==f)?" dim":"", col=GC[e.r.type]||"#E9A85C";
    return '<g class="gedge'+dim+'"><path d="M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="1.7" opacity=".6"/>'+
      ((f!=null && (e.s===f||e.t===f)) ? '<text x="'+cx.toFixed(1)+'" y="'+(cy-6).toFixed(1)+'" text-anchor="middle" font-size="11" fill="'+col+'" style="paint-order:stroke;stroke:#06080E;stroke-width:4px">'+esc(e.r.label)+'</text>' : "")+'</g>';
  }).join("");
  var nh = G.nodes.map(function(n,i){
    var dim=(f!=null && i!==f && !conn[i])?" dim":"", ac=acc(n.id);
    return '<g class="gnode'+dim+'" data-i="'+i+'">'+
      '<circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+(r+4)+'" fill="'+ac+'" opacity="'+(i===f?".3":".12")+'"/>'+
      (n.c.img? '<image href="'+n.c.img+'" x="'+(n.x-r).toFixed(1)+'" y="'+(n.y-r).toFixed(1)+'" width="'+(r*2)+'" height="'+(r*2)+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp-'+i+')"/>'
        : '<circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+r+'" fill="#141A28"/>')+
      '<circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+r+'" fill="none" stroke="'+ac+'" stroke-width="'+(i===f?2.4:1.3)+'"/>'+
      '<text x="'+n.x.toFixed(1)+'" y="'+(n.y+r+G.fs+3).toFixed(1)+'" text-anchor="middle" font-size="'+G.fs.toFixed(1)+'">'+esc(n.id)+'</text></g>';
  }).join("");
  svg.innerHTML = defs+'<g id="gview" transform="translate('+G.tx+','+G.ty+') scale('+G.k+')">'+eh+nh+'</g>';
}
function graphFocus(i){
  G.focus = (G.focus===i? null : i); paintGraph();
  var tip = $("#gtip"); if(!tip) return;
  if(G.focus==null){ tip.className="gtip"; return; }
  var n = G.nodes[G.focus].id;
  var rels = G.edges.filter(function(e){return e.s===G.focus||e.t===G.focus}).map(function(e){
    var o = G.nodes[e.s===G.focus?e.t:e.s].id; return o+"（"+e.r.label+"）"; }).join("、");
  tip.className="gtip on";
  tip.innerHTML = '<h4>'+esc(n)+'</h4><p>'+esc(rels)+'</p><div class="go"><button class="btn ghost" data-char="'+esc(n)+'" style="padding:8px 16px;font-size:13px">前往人物頁</button></div>';
}
function bindGraph(){
  var svg = $("#graph"); if(!svg || svg.__bound) return; svg.__bound = 1;
  var pts = {}, last=null, lastDist=0, moved=false;
  svg.addEventListener("pointerdown", function(e){ svg.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY};
    last={x:e.clientX,y:e.clientY}; moved=false; svg.classList.add("drag"); });
  svg.addEventListener("pointermove", function(e){
    if(!pts[e.pointerId]) return; pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids = Object.keys(pts);
    if(ids.length>=2){ var a=pts[ids[0]], b=pts[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(lastDist){ G.k=Math.max(.5,Math.min(3,G.k*(d/lastDist))); paintGraph(); } lastDist=d; moved=true; return; }
    if(last){ var dx=e.clientX-last.x, dy=e.clientY-last.y; if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
      G.tx+=dx; G.ty+=dy; last={x:e.clientX,y:e.clientY};
      var v=$("#gview"); if(v) v.setAttribute("transform","translate("+G.tx+","+G.ty+") scale("+G.k+")"); }
  });
  function up(e){ delete pts[e.pointerId]; if(Object.keys(pts).length<2) lastDist=0; last=null; svg.classList.remove("drag");
    if(!moved){ var g = e.target.closest ? e.target.closest(".gnode") : null;
      if(g) graphFocus(+g.getAttribute("data-i")); else { G.focus=null; paintGraph(); var t=$("#gtip"); if(t) t.className="gtip"; } } }
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", function(e){ e.preventDefault(); G.k=Math.max(.5,Math.min(3,G.k*(e.deltaY>0?0.92:1.08))); paintGraph(); }, {passive:false});
}

/* ---------------------------------------------------------- 狂粉測驗 */
var QZ = {run:null};   // run = {qs:[...], i, picked:[...], done}
function stars(n){ var h=""; for(var k=1;k<=5;k++) h+='<i class="'+(k<=n?"on":"")+'">★</i>'; return '<span class="stars" aria-label="難度 '+n+' 顆星">'+h+'</span>'; }
function quizPool(){ return S.quiz.filter(function(q){ return !locked(q.lv); }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function quizStart(){
  var pool = quizPool();
  var qs = shuffle(pool).slice(0,10).sort(function(a,b){ return a.star-b.star; })   // 由易到難
    .map(function(q){ return {q:q, opts:shuffle(q.opts)}; });
  QZ.run = {qs:qs, i:0, picked:[], done:false};
}
var QRANK = [[10,"三途川榮譽居民","業鏡羅漢親自發給你一面令旗。"],[8,"燒肉店常客","老闆記得你愛吃什麼。"],[6,"北境觀光客","功德還差一點，再刷一輪吧。"],[3,"剛下車的新靈魂","先跟引渡貓去報到。"],[0,"還在奈何橋上排隊","孟婆湯先喝一口，從 EP1 開始補。"]];
function pageQuiz(){
  var r = QZ.run, pool = quizPool();
  var head = '<div class="wrap"><section class="quiz">'+secHead("狂粉測驗","FAN QUIZ");
  if(!r){
    var cnt = [0,0,0,0,0]; S.quiz.forEach(function(q){ cnt[q.star-1]++; });
    return head+
      '<p class="lede">題庫共 '+S.quiz.length+' 題，每次隨機抽 10 題，由易到難。每題都出自劇中台詞，答完會告訴你是哪一集。</p>'+
      '<div class="qz-dist">'+cnt.map(function(c,k){ return '<div>'+stars(k+1)+'<b>'+c+'</b> 題</div>'; }).join("")+'</div>'+
      (state.spoiler && state.progress<MAXLV ? '<p class="qz-note">已開啟防雷：只會從你看過的進度出題（目前可出 '+pool.length+' 題）。可在右上角設定改變進度。</p>':'')+
      (pool.length<10 && pool.length? '<p class="qz-note">可出的題目不到 10 題，這次會全部出完。</p>':'')+
      (pool.length? '<button class="btn primary qz-go" data-qz="start">開始測驗 →</button>' : '<p class="qz-note">目前的閱讀進度還沒有可以出的題目。</p>')+
    '</section>'+foot()+'</div>';
  }
  if(r.done){
    var score = r.picked.filter(function(p,k){ return p===r.qs[k].q.opts[0]; }).length, n = r.qs.length;

        '<h3>'+rk[1]+'</h3><p>'+rk[2]+'</p>'+
        '<div class="qz-btns"><button class="btn primary" data-qz="start">再測一次</button><button class="btn ghost" data-qz="home">回到說明</button></div></div>'+
      '<ol class="qz-review">'+r.qs.map(function(x,k){

          '<div class="qz-ans">'+(ok?'答對：':'你選「'+esc(r.picked[k])+'」，正解：')+'<b>'+esc(x.q.opts[0])+'</b></div>'+
          '<button class="qz-src" data-ep="'+x.q.ep+'">'+esc(x.q.ep)+(EP[x.q.ep]?' ‧ '+esc(EP[x.q.ep].title):'')+' →</button></li>';
      }).join("")+'</ol>'+
    '</section>'+foot()+'</div>';
  }
  var x = r.qs[r.i], picked = r.picked[r.i], ans = picked!=null;
  return head+
    '<div class="qz-bar"><span>第 '+(r.i+1)+' / '+r.qs.length+' 題</span>'+stars(x.q.star)+'</div>'+
    '<div class="qz-track"><i style="width:'+((r.i+(ans?1:0))/r.qs.length*100)+'%"></i></div>'+
    '<div class="qz-card"><h3>'+esc(x.q.q)+'</h3><div class="qz-opts">'+x.opts.map(function(o,k){
      var cls = !ans ? "" : (o===x.q.opts[0] ? " right" : (o===picked ? " wrong" : " dim"));
      return '<button class="qz-opt'+cls+'" data-qa="'+k+'"'+(ans?' disabled':'')+'><i>'+"ABCD".charAt(k)+'</i>'+esc(o)+'</button>';
    }).join("")+'</div>'+
    (ans? '<div class="qz-why '+(picked===x.q.opts[0]?"ok":"ng")+'"><b>'+(picked===x.q.opts[0]?"答對了！":"可惜，正解是「"+esc(x.q.opts[0])+"」")+'</b>'+
      '<p>'+esc(x.q.note)+'</p><button class="qz-src" data-ep="'+x.q.ep+'">出處：'+esc(x.q.ep)+(EP[x.q.ep]?' ‧ '+esc(EP[x.q.ep].title):'')+' →</button></div>'+
      '<button class="btn primary" data-qz="next">'+(r.i+1<r.qs.length?"下一題 →":"看結果")+'</button>' : '')+
    '</div>'+
  '</section>'+foot()+'</div>';

function quizAct(t){

  else if(t.dataset.qz==="next"){ var r=QZ.run; if(r.i+1<r.qs.length) r.i++; else r.done=true; }

  if(["home","story","arcs","chars","data","quiz"].indexOf(p)<0) p="home";
  closeSheet(true);

function searchAll(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  var out = [];
  E.characters.forEach(function(c){
    if((c.name+" "+c.aka.join(" ")+" "+c.role).toLowerCase().indexOf(q)>=0)
      out.push({k:"人物", t:c.name, d:locked(c.lv)?"（超過閱讀進度）":(prof(c.name).oneLine||c.role), act:function(){closeOv(); openChar(c.name)}});
  });
  E.episodes.forEach(function(e){
    if(e.group==="other") return;
    if((e.id+" EP"+(e.no||"")+" "+e.title+" "+e.summary).toLowerCase().indexOf(q)>=0)
      out.push({k:"劇集 ‧ "+e.id, t:e.title, d:locked(e.lv)?"（超過閱讀進度）":firstSentence(e.summary,70), act:function(){closeOv(); openEp(e.id)}});
  });
  S.arcs.forEach(function(a){
    if((a.title+" "+a.kanji+" "+a.lead).toLowerCase().indexOf(q)>=0)
      out.push({k:"故事線", t:a.title, d:a.lead, act:function(){closeOv(); state.arc=a.id; go("arcs")}});
  });
  S.glossary.forEach(function(t){
    if((t.term+" "+(t.read||"")+" "+t.def).toLowerCase().indexOf(q)>=0)
      out.push({k:"詞彙", t:t.term, d:locked(t.lv)?"（超過閱讀進度）":t.def, act:function(){closeOv(); jumpTerm(t.id)}});
  });
  S.notes.forEach(function(n){
    if((n.title+" "+n.body).toLowerCase().indexOf(q)>=0)
      out.push({k:"雜談", t:n.title, d:n.body, act:function(){closeOv(); state.dtab="notes"; go("data")}});
  });
  return out.slice(0,40);
}

/* ---------------------------------------------------------- motion */
var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
  es.forEach(function(en){ if(!en.isIntersecting) return; var t=en.target; t.classList.add("in"); io.unobserve(t);
    if(t.dataset.count!=null) countUp(t); });
},{rootMargin:"0px 0px -8% 0px",threshold:.08}) : null;
var REVEAL = ".sec-head,.card,.season,.epc,.arc,.fc,.cc2,.rstep,.orbit,.curse,.sbanner,.known li,.hl blockquote,.av,.apps button,.erow";
function afterRender(root){
  if(!root) return;
  var groups = new Map();
  $$(REVEAL, root).forEach(function(el){
    if(el.closest(".rv")===el) return;
    var par = el.parentElement, k = groups.get(par)||0; groups.set(par,k+1);
    el.classList.add("rv"); el.style.setProperty("--rd", Math.min(k,8)*0.06+"s");
    if(io && !RM) io.observe(el); else el.classList.add("in");
  });
  $$(".tl2 li,[data-count],#typeq", root).forEach(function(el){ if(io && !RM) io.observe(el); else { el.classList.add("in"); if(el.dataset.count!=null) el.textContent=el.dataset.count; } });
  bindTilt(root);
  startSlides();
}
function countUp(el){
  var to=+el.dataset.count, t0=performance.now(), d=1300;
  (function f(t){ var k=Math.min(1,(t-t0)/d); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); })(t0);
}
function bindTilt(root){
  if(RM || !window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  $$(".season,.fc,.arc,.rstep,.epc", root).forEach(function(el){
    el.classList.add("tilt");
    el.addEventListener("pointermove", function(e){ var r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      el.style.transform="perspective(900px) rotateX("+(-y*6).toFixed(2)+"deg) rotateY("+(x*8).toFixed(2)+"deg) translateY(-3px)"; });
    el.addEventListener("pointerleave", function(){ el.style.transform=""; });
  });
}
var slideT=null, slideI=0;
function showSlide(i){ var imgs=$$("#slides img"), dots=$$("#dots button"); if(!imgs.length) return;
  slideI=(i+imgs.length)%imgs.length;
  imgs.forEach(function(im,k){ if(k===slideI){ im.classList.remove("on"); void im.offsetWidth; im.classList.add("on"); } else im.classList.remove("on"); });
  dots.forEach(function(d,k){ d.classList.toggle("on",k===slideI); }); }
function startSlides(){ clearInterval(slideT); slideI=0; if(!$("#slides") || RM) return;
  slideT=setInterval(function(){ if(!document.hidden) showSlide(slideI+1); }, 6000); }
